name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR makes the older run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      # No bundler, so a parse of every source file is the build.
      - name: node --check
        run: git ls-files '*.js' '*.cjs' '*.mjs' | xargs -n1 node --check
      - name: debug plan-file test
        run: npx jest test/unit/ws-handler.test.js -t "success path" 2>&1 | grep -E "PLANDEBUG|Tests:" ; npm test 2>&1 | grep -E "PLANDEBUG|Tests:"
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      # test:visual compares against pixel baselines rendered on the devbox, and
      # test:voice needs live speech daemons; both stay local.
      - run: npm run test:e2e
