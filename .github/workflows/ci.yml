name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR makes the older run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      # No bundler, so a parse of every source file is the build.
      - name: node --check
        run: git ls-files '*.js' '*.cjs' '*.mjs' | xargs -n1 node --check
      - run: npm test
      - run: npm run test:integration

  # The slow browser suite. The pre-push hook already runs it before every push
  # that touches JS, CSS or HTML, so a pull request does not run the whole suite
  # again; it runs here after the merge, and by hand from the Actions tab. A pull
  # request does run the specs it adds or changes, five times each (burn-in), and
  # refuses a newly added waitForTimeout (lint-waits). test:visual
  # compares against pixel baselines rendered on the devbox, and test:voice
  # needs live speech daemons; both stay local.
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Fails a pull request that adds a fixed wait to an e2e spec. Waits already on
  # the base do not count: only lines the diff adds.
  lint-waits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Refuse added waitForTimeout
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/lint-added-waits.js "$BASE_SHA" "$HEAD_SHA"

  # Runs each e2e spec the pull request adds or changes five times, so a flaky
  # spec fails on its own pull request. Specs only; a changed helper is covered by
  # the pre-push hook and the e2e job on main. No forced CPU load and no --workers
  # override: the config's own worker count applies.
  burn-in:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: List added or changed e2e specs
        id: specs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          list="$(node scripts/burn-in-specs.js "$BASE_SHA" "$HEAD_SHA")"
          if [ -z "$list" ]; then
            echo "burn-in: no e2e spec added or changed; skipped"
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "any=true" >> "$GITHUB_OUTPUT"
          {
            echo "list<<BURN_IN_EOF"
            echo "$list"
            echo "BURN_IN_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$list"
      - if: steps.specs.outputs.any == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run each spec five times
        if: steps.specs.outputs.any == 'true'
        env:
          SPECS: ${{ steps.specs.outputs.list }}
        run: |
          mapfile -t specs <<< "$SPECS"
          npm run test:e2e -- --repeat-each=5 --retries=0 "${specs[@]}"
